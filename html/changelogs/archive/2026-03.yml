  Stutternov:
  - balance: Redid Artifact's Brute/burn mods into DR, changed the way it caps
  - balance: Changed Fortitude a bit to make sure you don't go over a certain cap
  - balance: Viss now has masq breeches on cenipede legs and bone armor
